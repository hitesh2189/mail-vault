<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mail Vault · Workspace archive</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#17243a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#152638;color:white;padding:22px 5%;display:flex;align-items:center;justify-content:space-between}header a{color:white;text-decoration:none}.brand{font-size:23px;font-weight:700}.badge{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#72d4c2;margin-left:14px}main{max-width:1200px;margin:44px auto;padding:0 24px}h1{font-size:32px;letter-spacing:-1px;margin-bottom:10px}.muted{color:#69768a;font-size:14px}a{color:#116c67;text-decoration:none}a:hover{text-decoration:underline}.cards{display:flex;gap:20px;margin:28px 0}.card{background:white;border:1px solid #e1e6ee;border-radius:12px;padding:22px;flex:1}.number{font-size:27px;font-weight:700;margin-top:12px}form.filters{display:flex;gap:12px;flex-wrap:wrap;margin:26px 0}input,button{font:inherit;padding:12px;border-radius:7px;border:1px solid #d8dfe8}input[type=search]{flex:1;min-width:220px}button,.button{background:#126f69;color:white;border:0;cursor:pointer;padding:12px 18px;border-radius:7px;display:inline-block}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:17px;border-bottom:1px solid #e7ebf0}th{font-size:12px;color:#69768a;text-transform:uppercase;letter-spacing:1px}.table{overflow:auto;border:1px solid #e1e6ee;border-radius:12px}.subject{font-weight:600}.empty{padding:60px;text-align:center}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px}.mailbody{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font:15px/1.7 system-ui;background:white;padding:28px;border-radius:12px;border:1px solid #e1e6ee}.pager{display:flex;gap:24px;margin-top:24px}footer{font-size:12px;color:#69768a;margin-top:32px}header form{margin:0}header button{background:#284254;font-size:12px}@media(max-width:650px){.cards{flex-direction:column;gap:10px}.toolbar,header{align-items:flex-start;flex-direction:column}.badge{display:none}header{gap:12px}main{margin-top:25px}h1{font-size:26px}}
</style><header><a class="brand" href="/">Mail Vault <span class="badge">Google Workspace archive</span></a><form action="/logout" method="post"><input type="hidden" name="csrf" value="{{session.csrf}}"><a href="/settings" style="color:white;margin-right:18px;font-size:13px">Backup settings</a><span style="font-size:13px;margin-right:16px">{{session.owner}}</span><button>Sign out</button></form></header><main>{% block content %}{% endblock %}<footer>Private mailbox archive · Emails are displayed as safe text · All timestamps UTC</footer></main></html>
